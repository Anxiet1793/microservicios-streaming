      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - positionSeconds
              properties:
                positionSeconds: &a1
                  type: number
                  minimum: 0
                  description: Segundos absolutos; máximo durationSeconds + 2, normalizado a la
