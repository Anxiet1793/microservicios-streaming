components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
    Progress:
      type: object
      additionalProperties: false
      required:
        - positionSeconds
        - durationSeconds
        - percentage
        - updatedAt
      properties:
        positionSeconds: *a1
        durationSeconds:
          type: number
          exclusiveMinimum: true
          minimum: 0
        percentage:
          type: number
          minimum: 0
          maximum: 100
          readOnly: true
        updatedAt: &a2
          type: string
          format: date-time
    Asset:
      type: object
      additionalProperties: false
      required:
        - assetId
        - contentType
        - originalFilename
        - sizeBytes
        - durationSeconds
        - codec
        - width
        - height
        - status
        - createdAt
        - updatedAt
      properties:
        assetId:
          type: string
          pattern: ^ast_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        contentType:
          type: string
          enum:
            - video/mp4
        originalFilename:
          type: string
        sizeBytes:
          type: integer
          minimum: 1
        durationSeconds:
          type: number
        codec:
          type: string
          enum:
            - h264
        width:
          type: integer
        height:
          type: integer
        status:
          type: string
          enum:
            - READY
            - DELETED
        createdAt: *a2
        updatedAt: *a2
    Session:
      type: object
      additionalProperties: false
      required:
        - sessionId
        - tituloId
        - assetId
        - status
        - progress
        - startedAt
        - lastActivityAt
        - completedAt
      properties:
        sessionId:
          type: string
          pattern: ^ses_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        tituloId:
          type: string
          pattern: ^ttl_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        assetId:
          type: string
          pattern: ^ast_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        status:
          type: string
          enum:
            - REQUESTED
            - ACTIVE
            - PAUSED
            - COMPLETED
            - FAILED
        progress:
          $ref: "#/components/schemas/Progress"
        startedAt: *a2
        lastActivityAt: *a2
        completedAt:
          type: string
          format: date-time
          nullable: true
    PlaybackUrl:
      type: object
      additionalProperties: false
      required:
        - url
        - expiresIn
      properties:
        url:
          type: string
          format: uri
          description: URL S3 privada firmada; no guardar ni registrar en logs.
        expiresIn:
          type: integer
          minimum: 60
          maximum: 3600
    PlaybackResponse:
      type: object
      additionalProperties: false
      required:
        - session
        - playback
      properties:
        session:
          $ref: "#/components/schemas/Session"
        playback:
          $ref: "#/components/schemas/PlaybackUrl"
    SessionResponse:
      type: object
      additionalProperties: false
      required:
        - session
      properties:
        session:
          $ref: "#/components/schemas/Session"
    Pagination:
      type: object
      additionalProperties: false
      required:
        - page
        - limit
        - total
        - totalPages
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    ContinuePage:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - tituloId
              - progress
              - lastPlayedAt
            properties:
              tituloId:
                type: string
                pattern: ^ttl_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
              progress:
                $ref: "#/components/schemas/Progress"
              lastPlayedAt: *a2
        pagination:
          $ref: "#/components/schemas/Pagination"
    HistoryPage:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - tituloId
              - lastPlayedAt
              - completed
            properties:
              tituloId:
                type: string
                pattern: ^ttl_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
              lastPlayedAt: *a2
              completed:
                type: boolean
        pagination:
          $ref: "#/components/schemas/Pagination"
    Health:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - dependencies
      properties:
        status:
          type: string
          enum:
            - ok
            - unavailable
        service:
          type: string
          enum:
            - playback-service
        dependencies:
          type: object
          additionalProperties: false
          required:
            - mongodb
            - objectStorage
          properties:
            mongodb:
              type: string
              enum:
                - up
                - down
            objectStorage:
              type: string
              enum:
                - up
                - down
