openapi: 3.0.3
info:
  title: Users Service
  version: 1.0.0
  description: "Bounded Context Usuarios. JWT Bearer para operaciones propias. Refresh opaco solo en
    cookie HttpOnly. Las escrituras validan Origin; no hay CORS entre orígenes por defecto. Todos
    los objetos JSON son estrictos. Se rechazan queries repetidas/desconocidas. Body máximo 16 KiB
    configurable. Logs sin datos de entrada ni tokens. GET admite HEAD, rutas admiten OPTIONS (204).
    Todas las respuestas incluyen x-request-id y Cache-Control: no-store."
servers:
  - url: http://127.0.0.1:3001
tags:
  - name: Auth
  - name: Users
  - name: Watchlist
  - name: Preferences
  - name: Infrastructure
paths:
  /api/v1/auth/register:
    post:
      operationId: registerUser
      tags:
        - Auth
      summary: Registra usuario y perfil en una transacción
      description:
        Email normalizado con trim/lowercase. Rol USER asignado por servidor. No inicia sesión
        automáticamente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
            example:
              email: samuel@example.com
              password: PasswordSegura123!
              displayName: Samuel
      responses:
        "201":
          description: Usuario creado.
          headers:
            x-request-id:
              schema:
                type: string
                format: uuid
              description: ID generado por el servidor y correlacionado con logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterOutput"
        "400":
          description: "VALIDATION_ERROR: JSON, campos, identificadores o paginación inválidos."
          headers:
            x-request-id:
              schema:
                type: string
                format: uuid
              description: ID generado por el servidor y correlacionado con logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "FORBIDDEN: origen/CSRF o permisos insuficientes."
          headers:
            x-request-id:
              schema:
                type: string
                format: uuid
              description: ID generado por el servidor y correlacionado con logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: EMAIL_ALREADY_EXISTS o WATCHLIST_ITEM_ALREADY_EXISTS.
          headers:
            x-request-id:
              schema:
                type: string
                format: uuid
              description: ID generado por el servidor y correlacionado con logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: PAYLOAD_TOO_LARGE.
          headers:
            x-request-id:
              schema:
                type: string
                format: uuid
              description: ID generado por el servidor y correlacionado con logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: "UNSUPPORTED_MEDIA_TYPE: requiere JSON UTF-8 sin compresión."
          headers:
            x-request-id:
              schema:
                type: string
                format: uuid
              description: ID generado por el servidor y correlacionado con logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: RATE_LIMIT_EXCEEDED; Retry-After indica segundos restantes.
          headers:
            x-request-id:
              schema:
                type: string
                format: uuid
              description: ID generado por el servidor y correlacionado con logs.
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: INTERNAL_SERVER_ERROR; sin stack ni mensajes internos.
          headers:
            x-request-id:
              schema:
                type: string
                format: uuid
              description: ID generado por el servidor y correlacionado con logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Error general; métodos no permitidos devuelven 405 con Allow.
          headers:
            x-request-id:
              schema:
                type: string
                format: uuid
              description: ID generado por el servidor y correlacionado con logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/login:
    post:
      operationId: loginUser
      tags:
        - Auth
      summary: Inicia sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
            example:
              email: samuel@example.com
              password: PasswordSegura123!
      responses:
        "200":
          description: JWT de acceso y usuario. Refresh solo en cookie, nunca en el body.
          headers:
            x-request-id:
              schema:
                type: string
                format: uuid
              description: ID generado por el servidor y correlacionado con logs.
            Set-Cookie:
              schema:
                type: string
              description: users_refresh; HttpOnly; SameSite=Strict; Path=/api/v1/auth; Secure en
                APP_ENV=production. Sin Domain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: "VALIDATION_ERROR: JSON, campos, identificadores o paginación inválidos."
          headers:
            x-request-id:
              schema:
                type: string
                format: uuid
              description: ID generado por el servidor y correlacionado con logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description:
            UNAUTHORIZED o INVALID_CREDENTIALS. No distingue email/contraseña incorrectos, usuario
            inactivo o refresh inválido.
          headers:
            x-request-id:
              schema:
                type: string
                format: uuid
              description: ID generado por el servidor y correlacionado con logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "FORBIDDEN: origen/CSRF o permisos insuficientes."
          headers:
            x-request-id:
              schema:
                type: string
                format: uuid
              description: ID generado por el servidor y correlacionado con logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: PAYLOAD_TOO_LARGE.
          headers:
            x-request-id:
              schema:
                type: string
                format: uuid
              description: ID generado por el servidor y correlacionado con logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: "UNSUPPORTED_MEDIA_TYPE: requiere JSON UTF-8 sin compresión."
          headers:
            x-request-id:
              schema:
                type: string
                format: uuid
              description: ID generado por el servidor y correlacionado con logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: RATE_LIMIT_EXCEEDED; Retry-After indica segundos restantes.
          headers:
            x-request-id:
              schema:
                type: string
                format: uuid
              description: ID generado por el servidor y correlacionado con logs.
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: INTERNAL_SERVER_ERROR; sin stack ni mensajes internos.
          headers:
            x-request-id:
              schema:
                type: string
                format: uuid
              description: ID generado por el servidor y correlacionado con logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Error general; métodos no permitidos devuelven 405 con Allow.
          headers:
            x-request-id:
              schema:
                type: string
                format: uuid
              description: ID generado por el servidor y correlacionado con logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      tags:
        - Auth
      summary: Rota refresh y emite access token
      description:
        Cookie users_refresh requerida. Rotación de un solo uso con caducidad absoluta fija.
        Reutilizar un token consumido/revocado invalida su familia y responde 401. El frontend debe
        serializar los refresh; dos solicitudes simultáneas se consideran replay. Ante 401 se borra
        la cookie.
      security:
        - refreshCookie: []
      parameters:
        - name: X-CSRF-Protection
          in: header
          schema:
            type: string
            enum:
              - "1"
          description:
            Obligatoria con valor 1 cuando no se envía Origin. Si se envía Origin, debe coincidir
            exactamente con APP_ORIGIN.
      responses:
        "200":
          description: JWT de acceso y usuario. Refresh solo en cookie, nunca en el body.
          headers:
            x-request-id:
              schema:
                type: string
                format: uuid
              description: ID generado por el servidor y correlacionado con logs.
            Set-Cookie:
              schema:
                type: string
              description: users_refresh; HttpOnly; SameSite=Strict; Path=/api/v1/auth; Secure en
                APP_ENV=production. Sin Domain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: "VALIDATION_ERROR: JSON, campos, identificadores o paginación inválidos."
          headers:
            x-request-id:
              schema:
                type: string
                format: uuid
              description: ID generado por el servidor y correlacionado con logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description:
