              schema:
                type: string
                format: uuid
              description: ID generado por el servidor y correlacionado con logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateProfile
      tags:
        - Users
      summary: Actualiza parcialmente el perfil
      security:
        - bearerAuth: []
      description: Solo displayName, avatarUrl y preferredLanguage. avatarUrl=null elimina el campo.
        Campos ausentes se conservan; PATCH idéntico no modifica updatedAt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePatch"
            example:
              displayName: Samuel actualizado
              avatarUrl: null
      responses:
