x-catalog-image: &catalog-image
  image: catalog-service:${CATALOG_IMAGE_TAG:-local}
  build:
    context: .
    target: runner
  init: true

x-catalog-environment:
  &catalog-environment # El modo local usa exclusivamente el MongoDB de este proyecto Compose.
  MONGODB_URI: mongodb://mongo:27017
  MONGODB_DATABASE: ${MONGODB_DATABASE:-catalog_service}
  MONGODB_MAX_POOL_SIZE: ${MONGODB_MAX_POOL_SIZE:-10}
  MONGODB_SERVER_SELECTION_TIMEOUT_MS: ${MONGODB_SERVER_SELECTION_TIMEOUT_MS:-5000}
  MONGODB_QUERY_TIMEOUT_MS: ${MONGODB_QUERY_TIMEOUT_MS:-5000}
  BULK_MAX_ITEMS: ${BULK_MAX_ITEMS:-500}
  USERS_JWKS_URL: ${USERS_JWKS_URL:-http://host.docker.internal:3001/.well-known/jwks.json}
  JWT_ISSUER: ${JWT_ISSUER:-users-service}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-streaming-services}
  REQUEST_MAX_BYTES: ${REQUEST_MAX_BYTES:-5242880}

services:
  mongo:
    image: mongo:8.0@sha256:4968f22d0c6c10ef29952f3e807f62872ba22b3312f25803564fbfc08255efc2
    restart: unless-stopped
    volumes:
      - catalog_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12

  catalog-init:
    <<: *catalog-image
    environment: *catalog-environment
    command: ["node", "init-mongo.mjs"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      mongo:
        condition: service_healthy

  catalog-service:
    <<: *catalog-image
    environment: *catalog-environment
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${CATALOG_PORT:-3000}:3000"
    depends_on:
      mongo:
        condition: service_healthy
      catalog-init:
        condition: service_completed_successfully

volumes:
  catalog_mongo_data:
