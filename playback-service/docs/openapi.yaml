openapi: 3.0.3
info:
  title: Playback Service
  version: 0.1.0
  description: JWT RS256 emitido por Users Service. Todas las sesiones se limitan
    al propietario. Los MP4 se sirven desde MinIO con URLs firmadas, no desde
    esta API.
servers:
  - url: http://localhost:3002
paths:
  /api/health:
    get:
      operationId: health
      summary: Estado de MongoDB y MinIO
      security: []
      responses:
        "200":
          description: Operación completada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "400":
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: TITLE_NOT_FOUND / MEDIA_ASSET_NOT_FOUND / PLAYBACK_SESSION_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: INVALID_PLAYBACK_TRANSITION / TITLE_NOT_PUBLISHED /
            MEDIA_ASSET_IN_USE / SESSION_SUPERSEDED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: FILE_TOO_LARGE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: UNSUPPORTED_MEDIA_TYPE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: INTERNAL_SERVER_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: CATALOG_SERVICE_UNAVAILABLE / STORAGE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/media/assets:
    post:
      operationId: uploadAsset
      summary: "ADMIN: cargar MP4 H.264/AAC; máximo configurable 256 MiB"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Operación completada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - asset
                properties:
                  asset:
                    $ref: "#/components/schemas/Asset"
        "400":
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
