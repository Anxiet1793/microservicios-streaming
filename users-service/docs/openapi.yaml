  /api/v1/users/me/watchlist:
    get:
      operationId: getWatchlist
      tags:
        - Watchlist
      summary: Lista referencias para ver después
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      description:
        Orden addedAt descendente, tituloId ascendente. Offset máximo 10000. Conteo y página
        son lecturas separadas.
      responses:
        "200":
          description: Referencias sin metadata de Catálogo.
          headers:
            x-request-id:
              schema:
                type: string
                format: uuid
              description: ID generado por el servidor y correlacionado con logs.
          content:
            application/json:
              schema:
