components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT RS256
    refreshCookie:
      type: apiKey
      in: cookie
      name: users_refresh
  schemas:
    UserId:
      type: string
      pattern: ^usr_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      example: usr_00000000-0000-4000-8000-000000000001
    TituloId:
      type: string
      pattern: ^ttl_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      example: ttl_00000000-0000-4000-8000-000000000001
      description: Referencia externa del contrato de Catálogo; sin FK ni consulta síncrona a Catalog.
    Status:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
    Role:
      type: string
      enum:
        - USER
        - ADMIN
    PreferenceValue:
      type: string
      enum:
        - LIKE
        - DISLIKE
    Password:
      type: string
      minLength: 12
      maxLength: 128
      writeOnly: true
      description: 12–128 caracteres Unicode, sin NUL. No se recorta ni se normaliza; admite frases.
    Profile:
      type: object
      additionalProperties: false
      required:
        - displayName
        - avatarUrl
        - preferredLanguage
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        avatarUrl:
          type: string
          format: uri
          nullable: true
          maxLength: 2048
          pattern: ^https?://
          description: URL HTTP(S) sin credenciales. null elimina el avatar; no se descarga desde el servidor.
        preferredLanguage:
          type: string
          pattern: ^[a-z]{2}(-[A-Z]{2})?$
          example: es
    ProfilePatch:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        avatarUrl:
          type: string
          format: uri
          nullable: true
          maxLength: 2048
          pattern: ^https?://
          description: URL HTTP(S) sin credenciales. null elimina el avatar; no se descarga desde el servidor.
        preferredLanguage:
          type: string
          pattern: ^[a-z]{2}(-[A-Z]{2})?$
          example: es
      minProperties: 1
    AuthUser:
      type: object
      additionalProperties: false
      required:
        - userId
        - email
        - displayName
        - status
        - role
      properties:
        userId:
          $ref: "#/components/schemas/UserId"
        email:
          type: string
          format: email
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: "#/components/schemas/Status"
        role:
          $ref: "#/components/schemas/Role"
    User:
      type: object
      additionalProperties: false
      required:
        - userId
        - email
        - status
        - role
        - profile
        - createdAt
        - updatedAt
      properties:
        userId:
          $ref: "#/components/schemas/UserId"
        email:
          type: string
          format: email
        status:
          $ref: "#/components/schemas/Status"
        role:
          $ref: "#/components/schemas/Role"
        profile:
          $ref: "#/components/schemas/Profile"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RegisterInput:
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - displayName
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          $ref: "#/components/schemas/Password"
        displayName:
          type: string
          minLength: 1
          maxLength: 100
    RegisterOutput:
      type: object
      additionalProperties: false
      required:
        - user
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
    LoginInput:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
    Session:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - expiresIn
        - user
      properties:
        accessToken:
          type: string
          description: JWT RS256. Mantener en memoria del cliente; no contiene email ni passwordHash.
        expiresIn:
          type: integer
          example: 900
        user:
          $ref: "#/components/schemas/AuthUser"
    ChangePassword:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
        newPassword:
          $ref: "#/components/schemas/Password"
    WatchlistItem:
      type: object
      additionalProperties: false
      required:
        - tituloId
        - addedAt
      properties:
        tituloId:
          $ref: "#/components/schemas/TituloId"
        addedAt:
          type: string
          format: date-time
    ContentPreference:
      type: object
      additionalProperties: false
      required:
        - tituloId
        - value
        - createdAt
        - updatedAt
      properties:
        tituloId:
          $ref: "#/components/schemas/TituloId"
        value:
          $ref: "#/components/schemas/PreferenceValue"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PreferenceInput:
      type: object
      additionalProperties: false
      required:
        - value
      properties:
        value:
          $ref: "#/components/schemas/PreferenceValue"
    Pagination:
      type: object
      additionalProperties: false
      required:
        - page
        - limit
        - total
        - totalPages
      properties:
        page:
