  /api/v1/users/me/change-password:
    post:
      operationId: changePassword
      tags:
        - Users
      summary: Cambia contraseña y revoca todas las sesiones
      security:
        - bearerAuth: []
      description: "Verifica la contraseña actual, cambia el hash y revoca todos los refresh en una
        transacción. Incrementa authVersion: Users rechaza JWT anteriores inmediatamente. Otros
        servicios que solo verifican firma los aceptan hasta exp, salvo una política futura de
        revocación distribuida."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePassword"
            example:
              currentPassword: PasswordSegura123!
              newPassword: NuevaPasswordSegura456!
      responses:
        "204":
          description: Contraseña cambiada; volver a iniciar sesión. Se borra cookie.
          headers:
            x-request-id:
              schema:
                type: string
                format: uuid
              description: ID generado por el servidor y correlacionado con logs.
        "400":
