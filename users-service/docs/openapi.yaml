              schema:
                type: string
                format: uuid
              description: ID generado por el servidor y correlacionado con logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: RATE_LIMIT_EXCEEDED; Retry-After indica segundos restantes.
          headers:
            x-request-id:
              schema:
                type: string
                format: uuid
              description: ID generado por el servidor y correlacionado con logs.
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: INTERNAL_SERVER_ERROR; sin stack ni mensajes internos.
          headers:
            x-request-id:
              schema:
                type: string
                format: uuid
              description: ID generado por el servidor y correlacionado con logs.
          content:
