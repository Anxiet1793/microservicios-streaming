        "500":
          description: INTERNAL_SERVER_ERROR; sin stack ni mensajes internos.
          headers:
            x-request-id:
              schema:
                type: string
                format: uuid
              description: ID generado por el servidor y correlacionado con logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Error general; métodos no permitidos devuelven 405 con Allow.
          headers:
            x-request-id:
              schema:
                type: string
                format: uuid
              description: ID generado por el servidor y correlacionado con logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/logout:
    post:
      operationId: logoutUser
      tags:
        - Auth
      summary: Revoca la familia de sesión y borra la cookie
      description: Idempotente sin cookie o con token desconocido bien formado. Los access tokens ya
        emitidos conservan su validez hasta expirar; el cliente debe descartarlos.
      parameters:
        - name: X-CSRF-Protection
          in: header
          schema:
            type: string
            enum:
              - "1"
          description:
            Obligatoria con valor 1 cuando no se envía Origin. Si se envía Origin, debe coincidir
            exactamente con APP_ORIGIN.
      responses:
        "204":
          description: Sesión revocada, sin contenido.
          headers:
            x-request-id:
              schema:
                type: string
                format: uuid
              description: ID generado por el servidor y correlacionado con logs.
            Set-Cookie:
              schema:
                type: string
              description: Elimina users_refresh mediante Max-Age=0.
        "400":
          description: "VALIDATION_ERROR: JSON, campos, identificadores o paginación inválidos."
          headers:
            x-request-id:
              schema:
                type: string
                format: uuid
              description: ID generado por el servidor y correlacionado con logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description:
            UNAUTHORIZED o INVALID_CREDENTIALS. No distingue email/contraseña incorrectos, usuario
            inactivo o refresh inválido.
          headers:
            x-request-id:
              schema:
                type: string
                format: uuid
              description: ID generado por el servidor y correlacionado con logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "FORBIDDEN: origen/CSRF o permisos insuficientes."
          headers:
