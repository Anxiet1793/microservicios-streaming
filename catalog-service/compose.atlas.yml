# Archivo independiente: usar -f compose.atlas.yml, sin combinarlo con el local.
x-catalog-image: &catalog-image
  image: catalog-service:${CATALOG_IMAGE_TAG:-local}
  build:
    context: .
    target: runner
  init: true

x-catalog-environment: &catalog-environment
  MONGODB_URI: ${MONGODB_URI:?Configura MONGODB_URI para la base externa}
  MONGODB_DATABASE: ${MONGODB_DATABASE:-catalog_service}
  MONGODB_MAX_POOL_SIZE: ${MONGODB_MAX_POOL_SIZE:-10}
  MONGODB_SERVER_SELECTION_TIMEOUT_MS: ${MONGODB_SERVER_SELECTION_TIMEOUT_MS:-5000}
  MONGODB_QUERY_TIMEOUT_MS: ${MONGODB_QUERY_TIMEOUT_MS:-5000}
  BULK_MAX_ITEMS: ${BULK_MAX_ITEMS:-500}
  REQUEST_MAX_BYTES: ${REQUEST_MAX_BYTES:-5242880}

services:
  catalog-init:
    <<: *catalog-image
    environment: *catalog-environment
    command: ["node", "init-mongo.mjs"]
    restart: "no"
    healthcheck:
      disable: true

  catalog-service:
    <<: *catalog-image
    environment: *catalog-environment
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CATALOG_PORT:-3000}:3000"
    depends_on:
      catalog-init:
        condition: service_completed_successfully
